<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Risk Intel Copilot (Demo)</title>
    <meta name="description" content="Live demo of the Risk, Fraud & Regulatory Intelligence Copilot. Runs in your browser with fake sample data; no Snowflake, no AI call." />
    <!-- stlite = Streamlit running inside the browser (Pyodide). Pinned version, MIT license. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css" />
    <style>
      html, body { margin: 0; background: #090D16; color: #F3F4F6; font-family: system-ui, sans-serif; }
      #note { padding: 8px 16px; font-size: 13px; background: #111827; border-bottom: 1px solid #1F2937; }
      #note a { color: #93C5FD; }
    </style>
  </head>
  <body>
    <div id="note">
      Demo build: fake sample data, template SAR, no Snowflake, no AI call. First load takes about 20-60 seconds (Python starts in your browser).
      Code: <a href="https://github.com/Arunkumar06-cmd/risk-intelligence-copilot">GitHub repo</a>
    </div>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
      // App files are copied next to this page by .github/workflows/pages.yml.
      mount(
        {
          entrypoint: "streamlit_app.py",
          files: {
            "streamlit_app.py": { url: "./app/streamlit_app.py" },
            "backend/config.py": { url: "./app/backend/config.py" },
            "backend/demo.py": { url: "./app/backend/demo.py" },
            "backend/hybrid_agent.py": { url: "./app/backend/hybrid_agent.py" },
            "backend/runtime.py": { url: "./app/backend/runtime.py" },
          },
          streamlitConfig: {
            "theme.base": "dark",
            "theme.primaryColor": "#3B82F6",
            "theme.backgroundColor": "#090D16",
            "theme.secondaryBackgroundColor": "#111827",
            "theme.textColor": "#F3F4F6",
            "client.toolbarMode": "viewer",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
