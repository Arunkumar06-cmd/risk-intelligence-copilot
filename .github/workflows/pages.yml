name: Pages demo

# Publishes the in-browser demo (stlite = Streamlit inside the browser) to GitHub Pages.
# Demo mode only: fake sample data, template SAR, no Snowflake keys, no AI call.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build site (page + app files)
        run: |
          mkdir -p _site/app/backend
          cp site/index.html _site/index.html
          cp streamlit_app.py _site/app/
          cp backend/config.py backend/demo.py backend/hybrid_agent.py backend/runtime.py _site/app/backend/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
