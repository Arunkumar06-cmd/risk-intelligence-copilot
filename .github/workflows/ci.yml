name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least access: CI only reads the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m py_compile backend/config.py backend/demo.py backend/hybrid_agent.py backend/runtime.py streamlit_app.py
      - name: Lint (ruff, same rules as pre-commit)
        run: ruff check .
      - name: Run all tests (guards + agent SQL + app smoke)
        run: python -m pytest tests/ -q
