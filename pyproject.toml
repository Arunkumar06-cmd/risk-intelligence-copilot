[project]
name = "risk-intelligence-copilot"
version = "0.1.0"
description = "AI copilot for bank compliance: English questions to verified SQL + cited regulations + draft SARs."
requires-python = ">=3.11"

[tool.semantic_release]
version_variable = "pyproject.toml:project.version"
version_pattern = "version = \"{version}\""
branch = "main"
build_command = "echo no-build-step"
version_source = "commit"
commit_message = "chore(release): v{version} [skip ci]"
commit_author = "semantic-release <semantic-release@python-semantic-release.com>"

[tool.semantic_release.changelog]
template_dir = "templates"
exclude_commit_patterns = ["docs/*", ".github/*", "*.pptx", "*.png"]

[tool.ruff]
target-version = "py311"
